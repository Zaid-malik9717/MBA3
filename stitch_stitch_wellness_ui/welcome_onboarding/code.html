<style>
        /* Custom scrollbar hide for clean mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Ambient Glow Shadow */
        .shadow-ambient-primary {
            box-shadow: 0px 8px 32px 0px rgba(255, 180, 170, 0.15);
        }

        /* View transitions */
        .view-section {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding-bottom: 120px; /* Space for FABs */
        }
        
        .view-hidden-right {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }
        
        .view-hidden-left {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .view-active {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }
        
        /* Glass card styling */
        .glass-card {
            background-color: rgba(41, 23, 21, 0.5); /* surface-container-low with opacity */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-card.selected {
            border-color: #ffb4aa; /* primary */
            background-color: rgba(255, 180, 170, 0.05);
        }

<!-- Simple Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Screen 1: Goal Selection Logic
            const goalOptions = document.querySelectorAll('.goal-option');
            let hasSelectedGoal = false;

            goalOptions.forEach(option => {
                option.addEventListener('click', () => {
                    // Reset all
                    goalOptions.forEach(opt => {
                        opt.classList.remove('selected', 'shadow-ambient-primary');
                        opt.querySelector('.selection-indicator div').style.opacity = '0';
                        opt.querySelector('.selection-indicator').classList.remove('border-primary');
                        opt.querySelector('.selection-indicator').classList.add('border-outline-variant');
                    });
                    
                    // Set active
                    option.classList.add('selected', 'shadow-ambient-primary');
                    option.querySelector('.selection-indicator div').style.opacity = '1';
                    option.querySelector('.selection-indicator').classList.add('border-primary');
                    option.querySelector('.selection-indicator').classList.remove('border-outline-variant');
                    
                    hasSelectedGoal = true;
                });
            });

            // Activity Chips Logic
            const activityChips = document.querySelectorAll('.activity-chip');
            activityChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    activityChips.forEach(c => {
                        c.classList.remove('border-primary', 'bg-primary/10', 'text-primary', 'shadow-ambient-primary');
                        c.classList.add('border-outline-variant', 'text-secondary');
                    });
                    chip.classList.remove('border-outline-variant', 'text-secondary');
                    chip.classList.add('border-primary', 'bg-primary/10', 'text-primary', 'shadow-ambient-primary');
                });
            });

            // Navigation Logic
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const btnContinue = document.getElementById('btn-continue');
            const btnComplete = document.getElementById('btn-complete');
            const btnBack = document.getElementById('btn-back');

            btnContinue.addEventListener('click', () => {
                if(!hasSelectedGoal) {
                    // Optional: Visual shake if no goal selected. For now, just allow proceed.
                }
                step1.classList.remove('view-active');
                step1.classList.add('view-hidden-left');
                
                step2.classList.remove('view-hidden-right');
                step2.classList.add('view-active');

                // Swap CTA buttons
                btnContinue.classList.add('hidden');
                btnComplete.classList.remove('hidden');
            });

            btnBack.addEventListener('click', () => {
                step2.classList.remove('view-active');
                step2.classList.add('view-hidden-right');
                
                step1.classList.remove('view-hidden-left');
                step1.classList.add('view-active');

                // Swap CTA buttons back
                btnComplete.classList.add('hidden');
                btnContinue.classList.remove('hidden');
            });
        });
    </script>
