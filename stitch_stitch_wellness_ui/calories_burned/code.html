<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Calories Burned Analytics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Hanken+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#291715",
                        "secondary-container": "#474649",
                        "error": "#ffb4ab",
                        "secondary": "#c8c6c8",
                        "inverse-primary": "#c0000a",
                        "surface-dim": "#1f0f0d",

                        "tertiary-fixed": "#bbe9ff",
                        "on-tertiary-fixed": "#001f29",

                        "surface": "#1f0f0d",
                        "background": "#1f0f0d",
                        "tertiary": "#68d3fc",
                        "on-primary-fixed": "#410001",
                        "on-surface": "#fcdbd6",
                        "on-secondary-fixed-variant": "#474649",
                        "on-tertiary": "#003545",
                        "primary-container": "#ff5545",
                        "on-tertiary-container": "#002e3c",
                        "primary": "#ffb4aa",
                        "on-primary-fixed-variant": "#930005",
                        "inverse-on-surface": "#402b29",
                        "error-container": "#93000a",
                        "inverse-surface": "#fcdbd6",
                        "secondary-fixed": "#e4e2e4",
                        "surface-variant": "#44302d",
                        "secondary-fixed-dim": "#c8c6c8",
                        "outline-variant": "#5d3f3b",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-surface-variant": "#e7bdb7",
                        "outline": "#ad8883",
                        "primary-fixed": "#ffdad5",
                        "surface-bright": "#493431",
                        "surface-tint": "#ffb4aa",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#190a08",
                        "on-primary": "#690003",
                        "surface-container-highest": "#44302d",
                        "primary-fixed-dim": "#ffb4aa",
                        "tertiary-container": "#1d9cc3",
                        "on-background": "#fcdbd6",
                        "on-tertiary-fixed-variant": "#004d63",
                        "on-secondary-container": "#b6b4b7",
                        "on-secondary": "#303032",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#68d3fc",
                        "surface-container": "#2d1b18"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "16px",
                        "xs": "4px",
                        "md": "24px",
                        "sm": "12px",
                        "margin-desktop": "120px",
                        "lg": "40px",
                        "margin-mobile": "20px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "data-point": ["Sora"],
                        "body-md": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-display": ["Sora"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-md": ["Sora"],
                        "headline-lg-mobile": ["Sora"],
                        "headline-lg": ["Sora"]
                    },
                    "fontSize": {
                        "data-point": ["20px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-display": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-card {
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .ambient-glow {
            box-shadow: 0 0 32px 0 rgba(255, 85, 69, 0.15);
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-background/80 backdrop-blur-xl">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full overflow-hidden border border-white/10">
<img class="w-full h-full object-cover" data-alt="A candid, high-contrast black and white portrait of a young adult looking focused, set against a dark, minimalist background. The lighting highlights their features subtly." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBdLsJ9vBZUO5x6HYkLk-FWamizpKQRFR8UHIwlIg0rqMHNnGqDp1zPOGchhkCtPjicaiNcM3Bm7Tii6GQVDF7gkc7nL23fOWagDig-q6Ltaok9qBJVbicUt7FQlMl1RZZcfDQR5JRqvRqPr6MY8uO4FClLEiTY0iXUORx4Tc2jYP_Kqn1CRkrrzGnrXQzVYHnpv3LB4HrWbq5uEZFi3Wn6n0sTl2AR9MVXYrXIqEnVuBQ8rw8-iPFX"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">Good morning, Alex</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low border border-white/10 text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[88px] pb-[100px] px-margin-mobile flex flex-col gap-md">
<!-- Hero Metrics Card -->
<section class="glass-card rounded-xl p-md flex flex-col items-center justify-center relative overflow-hidden ambient-glow border-t-white/20 border-t">
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-xs z-10">Total Calories Burned</span>
<div class="flex items-baseline gap-xs z-10">
<span class="font-headline-display text-headline-display text-primary">1,850</span>
<span class="font-data-point text-data-point text-on-surface-variant">kcal</span>
</div>
<div class="mt-md w-full flex justify-between items-center bg-surface-container/50 rounded-lg p-sm border border-white/5 z-10">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">Daily Goal</span>
<span class="font-data-point text-data-point text-on-surface">2,200 <span class="text-sm font-body-md text-on-surface-variant">kcal</span></span>
</div>
<div class="w-12 h-12 relative flex items-center justify-center">
<!-- Progress Ring Simulation -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-surface-container-high" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="4"></path>
<path class="text-primary" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="84, 100" stroke-linecap="round" stroke-width="4"></path>
</svg>
<span class="absolute text-[10px] font-bold text-on-surface">84%</span>
</div>
</div>
</section>
<!-- Breakdown Bento Grid -->
<section class="grid grid-cols-2 gap-sm">
<!-- Workout Breakdown -->
<div class="glass-card rounded-xl p-sm flex flex-col gap-sm border-t-white/10 border-t">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-label-caps text-label-caps uppercase">Workout</span>
</div>
<div class="flex flex-col">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">1,250</span>
<span class="font-body-md text-body-md text-on-surface-variant">kcal</span>
</div>
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-[67%] rounded-full"></div>
</div>
</div>
<!-- Walking Breakdown -->
<div class="glass-card rounded-xl p-sm flex flex-col gap-sm border-t-white/10 border-t">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
<span class="font-label-caps text-label-caps uppercase">Walking</span>
</div>
<div class="flex flex-col">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">600</span>
<span class="font-body-md text-body-md text-on-surface-variant">kcal</span>
</div>
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary-container w-[33%] rounded-full"></div>
</div>
</div>
</section>
<!-- Weekly Trend Chart -->
<section class="glass-card rounded-xl p-md flex flex-col gap-sm border-t-white/10 border-t">
<div class="flex justify-between items-center mb-sm">
<h2 class="font-data-point text-data-point text-on-surface">Weekly Trend</h2>
<span class="font-label-caps text-label-caps text-primary bg-primary/10 px-2 py-1 rounded">Avg: 1.9k</span>
</div>
<!-- Faux Chart Area -->
<div class="h-32 w-full flex items-end justify-between gap-1 relative mt-sm">
<!-- Grid Lines -->
<div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20">
<div class="w-full h-px bg-white border-dashed"></div>
<div class="w-full h-px bg-white border-dashed"></div>
<div class="w-full h-px bg-white border-dashed"></div>
</div>
<!-- Bars -->
<div class="w-full bg-primary/20 rounded-t-sm h-[60%] relative group">
<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 hidden group-hover:block bg-surface-container-highest text-xs px-1 rounded z-10">1.4k</div>
</div>
<div class="w-full bg-primary/20 rounded-t-sm h-[85%] relative group"></div>
<div class="w-full bg-primary rounded-t-sm h-[95%] relative group ambient-glow"></div> <!-- Peak Day -->
<div class="w-full bg-primary/20 rounded-t-sm h-[40%] relative group"></div>
<div class="w-full bg-primary/20 rounded-t-sm h-[75%] relative group"></div>
<div class="w-full bg-primary/20 rounded-t-sm h-[50%] relative group"></div>
<div class="w-full bg-primary/20 rounded-t-sm h-[80%] relative group"></div>
</div>
<div class="flex justify-between text-on-surface-variant font-label-caps text-label-caps mt-2 px-1">
<span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-20 bg-surface-container-lowest/70 backdrop-blur-2xl">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-all w-16 h-full gap-1" href="#">
<span class="material-symbols-outlined text-2xl">home_app_logo</span>
<span class="font-label-caps text-label-caps text-[10px]">Home</span>
</a>
<!-- Workouts -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-all w-16 h-full gap-1" href="#">
<span class="material-symbols-outlined text-2xl">fitness_center</span>
<span class="font-label-caps text-label-caps text-[10px]">Workouts</span>
</a>
<!-- Diet -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-all w-16 h-full gap-1" href="#">
<span class="material-symbols-outlined text-2xl">restaurant</span>
<span class="font-label-caps text-label-caps text-[10px]">Diet</span>
</a>
<!-- Progress (Active) -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary font-bold scale-110 duration-300 ease-out w-16 h-full gap-1" href="#">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">monitoring</span>
<span class="font-label-caps text-label-caps text-[10px]">Progress</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary opacity-60 hover:opacity-100 transition-all w-16 h-full gap-1" href="#">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="font-label-caps text-label-caps text-[10px]">Profile</span>
</a>
</nav>
</body></html>
