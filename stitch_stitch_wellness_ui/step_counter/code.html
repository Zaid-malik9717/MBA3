<!-- Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Animate Number
            const displayEl = document.getElementById('step-count-display');
            const targetNumber = 10542;
            const duration = 1500; // ms
            const frameRate = 1000 / 60;
            const totalFrames = Math.round(duration / frameRate);
            let frame = 0;

            const easeOutQuart = (t) => 1 - Math.pow(1 - t, 4);

            const counterInterval = setInterval(() => {
                frame++;
                const progress = easeOutQuart(frame / totalFrames);
                const currentNumber = Math.round(targetNumber * progress);
                
                // Format with comma
                displayEl.innerText = currentNumber.toLocaleString('en-US');

                if (frame >= totalFrames) {
                    clearInterval(counterInterval);
                    displayEl.innerText = targetNumber.toLocaleString('en-US');
                }
            }, frameRate);

            // Animate SVG Ring
            setTimeout(() => {
                const circle = document.getElementById('progress-circle');
                const radius = circle.r.baseVal.value;
                const circumference = radius * 2 * Math.PI;
                const percent = 85; // 85% goal completion
                
                const offset = circumference - (percent / 100) * circumference;
                circle.style.strokeDashoffset = offset;
            }, 100); // small delay to ensure CSS transition kicks in
        });
    </script>
